<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nila & Milo - Animation 3D & Dialogue</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; }
        button {
            padding: 14px 24px; font-size: 16px; font-weight: bold; color: #fff;
            background-color: #10b981; border: none; border-radius: 12px; cursor: pointer;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4); transition: all 0.2s;
        }
        button:hover { background-color: #059669; transform: translateY(-2px); }
        button:disabled { background-color: #64748b; transform: none; box-shadow: none; }

        /* Bulles de dialogue HTML */
        .speech-bubble {
            position: absolute;
            background: #ffffff;
            color: #1e293b;
            padding: 12px 18px;
            border-radius: 18px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            pointer-events: none;
            opacity: 0;
            transform: scale(0.8) translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            white-space: nowrap;
            z-index: 5;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }
        .speech-bubble.active {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">
        <button id="recordBtn">🎥 Enregistrer la scène (8 sec)</button>
    </div>

    <!-- Bulles de dialogue -->
    <div id="bubble-nila" class="speech-bubble">Coucou Milo ! Prêt pour l'aventure ? 🚀</div>
    <div id="bubble-milo" class="speech-bubble">Toujours prêt Nila ! En avant ! ✨</div>

    <script>
        // --- 1. Scène, Caméra, Rendu ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e1b4b);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2.2, 7);
        camera.lookAt(0, 1.2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- 2. Éclairage ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffedd5, 1.2);
        sunLight.position.set(5, 10, 7);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        scene.add(sunLight);

        const rimLight = new THREE.DirectionalLight(0x818cf8, 0.8);
        rimLight.position.set(-5, 4, -4);
        scene.add(rimLight);

        // --- 3. Décoration Sol ---
        const floorGeo = new THREE.CylinderGeometry(4.5, 4.8, 0.4, 64);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x312e81, roughness: 0.5 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.position.y = -0.2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Fonction création d'œil avec reflet
        function createEye() {
            const eyeGroup = new THREE.Group();
            const white = new THREE.Mesh(
                new THREE.SphereGeometry(0.18, 32, 32),
                new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 })
            );
            white.scale.set(1, 1.1, 0.5);
            eyeGroup.add(white);

            const iris = new THREE.Mesh(
                new THREE.SphereGeometry(0.09, 16, 16),
                new THREE.MeshStandardMaterial({ color: 0x0f172a })
            );
            iris.position.set(0, 0, 0.12);
            eyeGroup.add(iris);

            const shine = new THREE.Mesh(
                new THREE.SphereGeometry(0.03, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            shine.position.set(0.04, 0.04, 0.18);
            eyeGroup.add(shine);

            return eyeGroup;
        }

        // --- 4. Personnage NILA (Violette) ---
        const nilaGroup = new THREE.Group();
        const nilaMat = new THREE.MeshStandardMaterial({ color: 0x9333ea, roughness: 0.3, metalness: 0.1 });

        // Corps
        const nilaBody = new THREE.Mesh(new THREE.SphereGeometry(0.85, 32, 32), nilaMat);
        nilaBody.scale.set(1, 1.25, 0.9);
        nilaBody.castShadow = true;
        nilaGroup.add(nilaBody);

        // Antenne douce
        const antenna = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), nilaMat);
        antenna.position.set(0, 1.15, 0);
        nilaGroup.add(antenna);

        // Yeux
        const nilaEyeL = createEye(); nilaEyeL.position.set(-0.28, 0.3, 0.7); nilaGroup.add(nilaEyeL);
        const nilaEyeR = createEye(); nilaEyeR.position.set(0.28, 0.3, 0.7); nilaGroup.add(nilaEyeR);

        // Bras Droit (pour saluer)
        const nilaArmRGroup = new THREE.Group();
        nilaArmRGroup.position.set(0.8, 0.1, 0);
        const nilaArmR = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.5), nilaMat);
        nilaArmR.position.set(0.2, 0, 0);
        nilaArmR.rotation.z = -Math.PI / 3;
        nilaArmRGroup.add(nilaArmR);
        nilaGroup.add(nilaArmRGroup);

        // Bras Gauche
        const nilaArmL = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.5), nilaMat);
        nilaArmL.position.set(-0.85, 0, 0);
        nilaArmL.rotation.z = Math.PI / 4;
        nilaGroup.add(nilaArmL);

        nilaGroup.position.set(-1.4, 1.1, 0);
        scene.add(nilaGroup);

        // --- 5. Personnage MILO (Orange) ---
        const miloGroup = new THREE.Group();
        const miloMat = new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.3, metalness: 0.1 });

        // Corps
        const miloBody = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.65, 1.0, 32), miloMat);
        miloBody.castShadow = true;
        miloGroup.add(miloBody);

        const miloTop = new THREE.Mesh(new THREE.SphereGeometry(0.65, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), miloMat);
        miloTop.position.y = 0.5; miloGroup.add(miloTop);
        const miloBot = new THREE.Mesh(new THREE.SphereGeometry(0.65, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), miloMat);
        miloBot.position.y = -0.5; miloBot.rotation.x = Math.PI; miloGroup.add(miloBot);

        // Yeux
        const miloEyeL = createEye(); miloEyeL.position.set(-0.25, 0.35, 0.6); miloGroup.add(miloEyeL);
        const miloEyeR = createEye(); miloEyeR.position.set(0.25, 0.35, 0.6); miloGroup.add(miloEyeR);

        // Head Group (pour hocher la tête)
        const miloHeadGroup = new THREE.Group();
        miloGroup.add(miloHeadGroup);

        miloGroup.position.set(1.4, 1.1, 0);
        scene.add(miloGroup);

        // --- 6. Synchronisation 3D -> Bulles HTML ---
        const bubbleNila = document.getElementById('bubble-nila');
        const bubbleMilo = document.getElementById('bubble-milo');
        const tempV = new THREE.Vector3();

        function updateBubblePosition(object, bubbleElement, offsetY) {
            object.getWorldPosition(tempV);
            tempV.y += offsetY;
            tempV.project(camera);

            const x = (tempV.x * .5 + .5) * window.innerWidth;
            const y = (-(tempV.y * .5) + .5) * window.innerHeight;

            bubbleElement.style.left = `${x}px`;
            bubbleElement.style.top = `${y}px`;
            bubbleElement.style.transform = `translate(-50%, -100%) scale(${bubbleElement.classList.contains('active') ? 1 : 0.8})`;
        }

        // --- 7. Animation et Scénario ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            // Mouvement de base (respiration)
            nilaGroup.position.y = 1.1 + Math.sin(t * 2) * 0.05;
            miloGroup.position.y = 1.1 + Math.cos(t * 2) * 0.05;

            // Regard l'un vers l'autre
            nilaGroup.rotation.y = 0.3;
            miloGroup.rotation.y = -0.3;

            // Gestion du dialogue et animations spécifiques
            const cycleTime = t % 8; // Cycle de 8 secondes

            if (cycleTime > 1 && cycleTime < 4) {
                // Nila parle
                bubbleNila.classList.add('active');
                bubbleMilo.classList.remove('active');
                // Nila salue de la main
                nilaArmRGroup.rotation.z = Math.sin(t * 10) * 0.3;
            } else if (cycleTime > 4.5 && cycleTime < 7.5) {
                // Milo parle
                bubbleNila.classList.remove('active');
                bubbleMilo.classList.add('active');
                nilaArmRGroup.rotation.z = 0;
                // Milo hoche la tête
                miloGroup.rotation.x = Math.sin(t * 8) * 0.1;
            } else {
                bubbleNila.classList.remove('active');
                bubbleMilo.classList.remove('active');
                miloGroup.rotation.x = 0;
                nilaArmRGroup.rotation.z = 0;
            }

            // Mise à jour position bulles
            updateBubblePosition(nilaGroup, bubbleNila, 1.4);
            updateBubblePosition(miloGroup, bubbleMilo, 1.3);

            renderer.render(scene, camera);
        }
        animate();

        // --- 8. Redimensionnement & Enregistrement ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const recordBtn = document.getElementById('recordBtn');
        recordBtn.addEventListener('click', () => {
            recordBtn.disabled = true;
            recordBtn.innerText = "⏳ Enregistrement (8 sec)...";

            const stream = renderer.domElement.captureStream(30);
            const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            const chunks = [];

            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'nila_milo_dialogue.webm';
                a.click();

                recordBtn.disabled = false;
                recordBtn.innerText = "🎥 Enregistrer la scène (8 sec)";
            };

            recorder.start();
            setTimeout(() => recorder.stop(), 8000); // Enregistre pendant 8 secondes
        });
    </script>
</body>
</html>
